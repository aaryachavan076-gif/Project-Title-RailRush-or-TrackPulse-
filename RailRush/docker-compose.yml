# Docker Compose for MySQL

version: "3.8"
services:
  mysql:
    image: mysql:8.0
    container_name: railrush-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: railrush_demo
      MYSQL_USER: railrush_user
      MYSQL_PASSWORD: railrush_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data: